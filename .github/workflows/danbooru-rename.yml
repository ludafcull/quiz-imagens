name: Anime Character Recognition - Danbooru Tagger

on:
  workflow_dispatch:
  push:
    paths:
      - 'waifu/**'
    branches:
      - main

jobs:
  rename-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pillow onnxruntime opencv-python huggingface-hub gitpython numpy

      - name: Rename with Danbooru Tagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import subprocess
          from pathlib import Path
          from PIL import Image
          import cv2
          import numpy as np
          
          print("🤖 Carregando modelo Danbooru Tagger...")
          
          # Download model from Hugging Face
          from huggingface_hub import hf_hub_download
          
          model_path = hf_hub_download(
              repo_id="SmilingWolf/wd-v1-4-convnext-tagger-v2",
              filename="model.onnx",
              cache_dir="./model_cache"
          )
          
          csv_path = hf_hub_download(
              repo_id="SmilingWolf/wd-v1-4-convnext-tagger-v2",
              filename="selected_tags.csv",
              cache_dir="./model_cache"
          )
          
          import onnxruntime as ort
          import csv
          
          # Load tags
          tags = []
          with open(csv_path, 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  tags.append(row['name'])
          
          # Load model
          session = ort.InferenceSession(model_path)
          input_name = session.get_inputs()[0].name
          output_name = session.get_outputs()[0].name
          
          waifu_dir = Path("waifu")
          renamed_count = 0
          
          print(f"\n{'='*60}")
          print(f"Processando com Danbooru Tagger...")
          print(f"{'='*60}\n")
          
          for idx, image_file in enumerate(sorted(waifu_dir.glob("*")), 1):
              if not image_file.is_file():
                  continue
              
              ext = image_file.suffix.lower()
              if ext not in ['.jpg', '.jpeg', '.png', '.gif', '.webp']:
                  continue
              
              old_name = image_file.name
              print(f"[{idx}] 📸 {old_name}")
              
              try:
                  # Load and preprocess image
                  image = cv2.imread(str(image_file))
                  image = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)
                  
                  # Resize to 448x448
                  image = cv2.resize(image, (448, 448))
                  image = image.astype(np.float32) / 255.0
                  image = np.transpose(image, (2, 0, 1))
                  image = np.expand_dims(image, axis=0)
                  
                  # Run inference
                  output = session.run([output_name], {input_name: image})[0]
                  
                  # Get character tags
                  character_tags = []
                  for i, tag in enumerate(tags):
                      if 'character:' in tag and output[0][i] > 0.5:
                          character_tags.append(tag.replace('character:', '').strip())
                  
                  if character_tags:
                      character_name = character_tags[0]
                  else:
                      # Try any tag with high confidence
                      top_indices = np.argsort(output[0])[-5:][::-1]
                      for idx_tag in top_indices:
                          if output[0][idx_tag] > 0.3 and 'character:' not in tags[idx_tag]:
                              character_name = tags[idx_tag]
                              break
                      else:
                          print(f"    ⚠️ Não identificado\n")
                          continue
                  
                  print(f"    Tags: {character_tags}")
                  
                  # Clean name
                  clean_name = "".join(c if c.isalnum() or c in ('-', '_') else '' for c in character_name)
                  clean_name = clean_name[:50]
                  
                  if len(clean_name) < 2:
                      print(f"    ⚠️ Nome inválido\n")
                      continue
                  
                  new_name = f"{clean_name}{ext}"
                  new_path = waifu_dir / new_name
                  
                  # Avoid duplicates
                  if new_path.exists() and new_path != image_file:
                      counter = 1
                      while new_path.exists():
                          new_name = f"{clean_name}_{counter}{ext}"
                          new_path = waifu_dir / new_name
                          counter += 1
                  
                  subprocess.run(["git", "mv", str(image_file), str(new_path)], check=True)
                  
                  print(f"    ✅ Renomeado para: {new_name}\n")
                  renamed_count += 1
                  
              except Exception as e:
                  print(f"    ❌ Erro: {e}\n")
                  continue
          
          print(f"\n{'='*60}")
          print(f"✅ Total renomeados: {renamed_count}")
          print(f"{'='*60}\n")
          
          result = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
          
          if result.stdout.strip():
              subprocess.run(["git", "config", "user.name", "danbooru-bot"], check=True)
              subprocess.run(["git", "config", "user.email", "bot@github.com"], check=True)
              subprocess.run(["git", "commit", "-m", f"🤖 Danbooru Tagger: {renamed_count} personagens identificados"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("✅ Commit realizado!")
          else:
              print("ℹ️ Nenhuma mudança")
          
          EOF

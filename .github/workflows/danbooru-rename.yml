name: Anime Character Recognition - Danbooru Tagger

on:
  workflow_dispatch:
  push:
    paths:
      - 'waifu/**'
    branches:
      - main

jobs:
  rename-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pillow onnxruntime opencv-python-headless huggingface-hub gitpython numpy

      - name: Rename with Danbooru Tagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/rename_script.py
name: Reverter nomes das fotos

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: 'Caminho da pasta das fotos'
        required: true
        default: 'waifu'

permissions:
  contents: write

jobs:
  reverter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverter último rename de cada arquivo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          PASTA="${{ github.event.inputs.pasta }}"
          for arquivo in "$PASTA"/*; do
            [ -f "$arquivo" ] || continue
            LINHA=$(git log --follow --diff-filter=R --name-status --pretty=format: -- "$arquivo" | grep -E '^R' | head -n1)
            if [ -n "$LINHA" ]; then
              NOME_ANTIGO=$(echo "$LINHA" | awk -F'\t' '{print $2}')
              if [ -n "$NOME_ANTIGO" ] && [ "$NOME_ANTIGO" != "$arquivo" ]; then
                if [ -e "$NOME_ANTIGO" ]; then
                  echo "Já existe, pulando: $NOME_ANTIGO"
                else
                  echo "Renomeando $arquivo -> $NOME_ANTIGO"
                  git mv "$arquivo" "$NOME_ANTIGO"
                fi
              fi
            fi
          done
          git commit -m "Revertendo último rename das fotos" || echo "Nada pra commitar"
          git push